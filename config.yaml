# Mini-JEPA settings (spec v1.1). Every script reads its settings from here.
# Paths are relative to the project root.
seed: 0

data:
  path: data/transitions.npz        # every collected transition, one file
  splits_path: data/splits.json     # episode split + held-out (state, action) pairs
  episodes: 200
  steps_per_episode: 50             # random actions per episode -> 10,000 transitions
  terminate_on_goal: false          # keep going through the goal so its transitions are recorded
  cell_px: 8                        # 3 x 40 x 48 frames
  split_fractions: [0.8, 0.1, 0.1]  # train / val / test, by episode
  heldout_pairs: 10                 # (state, action) pairs the predictor never trains on
  heldout_min_collisions: 2         # bumps get their natural share (3 of 10 here), never fewer than this

# Step 3 / Stage 0: (x, y, one-hot action) -> next (x, y), before images are involved.
numerical:
  hidden: [64, 64]
  lr: 0.001
  batch_size: 64
  epochs: 50
  checkpoint: checkpoints/numerical.pt
  metrics: checkpoints/numerical_metrics.json

# Step 4: linear probe, latent vector -> which of the 25 free cells the robot is in.
# Fit on the training split only (full-batch softmax regression on standardised features).
probe:
  steps: 500
  lr: 0.05
  weight_decay: 0.0001

# Step 5 / Stage 1: CNN autoencoder on training-split frames, then freeze the encoder.
encoder:
  latent_dim: 32
  lr: 0.001
  batch_size: 64
  epochs: 50
  gate_epoch: 30                # check the gate here; if it fails, retrain with robot pixels weighted
  robot_weight: 1.0             # first attempt: plain pixel MSE
  fallback_robot_weight: 10.0
  gate_probe_accuracy: 0.99     # linear probe on validation latents
  checkpoint: checkpoints/encoder.pt          # frozen encoder + latent mu / sigma + codebook
  decoder_checkpoint: checkpoints/decoder.pt  # for visualising imagined states only
  metrics: checkpoints/encoder_metrics.json
  decodes_png: checkpoints/encoder_decodes.png

# Step 6 / Stage 2: residual latent predictor z_hat = z + f(z, a) on frozen, standardised latents.
predictor:
  hidden: [128, 128]                 # 36 -> 128 -> 128 -> 32
  last_layer_init: 0.001             # last layer starts near zero, so z_hat starts near z
  lr: 0.001
  batch_size: 64
  epochs: 50
  curriculum: [[1, 1], [11, 2], [21, 4]]   # [from epoch, rollout length K]
  select_horizon: 5                  # pick the epoch with the best val snap accuracy at this many steps
  eval_horizon: 10                   # report snap accuracy at 1..10 steps
  checkpoint: checkpoints/predictor.pt
  metrics: checkpoints/predictor_metrics.json

# Step 7: imagination and the latent graph (no simulator calls).
imagination:
  unknown_factor: 3.0        # a snap is "unknown" if farther than this x the median one-step error
  metrics: checkpoints/graph_metrics.json

# Step 8: planners sharing one MPC loop (execute the first action, re-observe, replan).
planning:
  max_actions: 30
  max_visits: 3              # stop (loop failure) on the third visit to the same cell
  revisit_penalty: 0.5       # x times the plan's first imagined state was already visited
  p0: {horizon: 5}                    # all 1,024 sequences, cost = final latent distance (ablation)
  p1: {horizon: 12, beam_width: 64}   # beam search, cost = closest latent distance along the way
  p2: {horizon: 3}                    # all 64 sequences, cost = min_k [k + D(snap(z_k))] (primary)
  metrics: checkpoints/planning_metrics.json

# Step 9: evaluation and diagnostic ladder. `python -m evaluation` regenerates everything.
evaluation:
  seeds: [0, 1, 2, 3, 4]     # 24 starts x 5 seeds = 120 episodes per planner / rung
  horizon: 10                # model metrics at 1..10 imagined steps
  results_dir: results       # results.md, results.json and the plots
